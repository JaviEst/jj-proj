name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  packages: write

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: code/frontend/frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix code/frontend/frontend ci

      - name: Lint (if configured)
        run: npm --prefix code/frontend/frontend run lint --if-present

      - name: Type check (if configured)
        run: npm --prefix code/frontend/frontend run typecheck --if-present

      - name: Build
        run: npm --prefix code/frontend/frontend run build

      - name: Unit tests (if configured)
        run: npm --prefix code/frontend/frontend test --if-present

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm --prefix code/frontend/frontend ci

      - name: Install Playwright Chromium
        run: npx --yes playwright@1.52.0 install --with-deps chromium

      - name: Run Playwright E2E
        run: npx --yes playwright@1.52.0 test -c code/frontend/frontend/playwright.config.mjs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: code/frontend/frontend/playwright-report

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: code/frontend/Dockerfile.frontend

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        run: docker build -f code/frontend/Dockerfile.frontend -t asset-ltv-frontend:ci .

  docker-publish:
    runs-on: ubuntu-latest
    needs: [lint-build-test, e2e, hadolint, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_DOCKER_IMAGES == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/asset-ltv-frontend:latest
          docker build -f code/frontend/Dockerfile.frontend -t "$IMAGE" .
          docker push "$IMAGE"
