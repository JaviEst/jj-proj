name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "code/backend/**"
      - "Dockerfile.fullstack"
      - "docker-compose.yml"
      - "docker-compose.debug.yml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "code/backend/**"
      - "Dockerfile.fullstack"
      - "docker-compose.yml"
      - "docker-compose.debug.yml"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read
  security-events: write
  packages: write

jobs:
  lint-format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install tox
        run: python -m pip install --upgrade pip tox

      - name: Ruff format check
        run: tox -e format

      - name: Ruff lint
        run: tox -e lint

  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Unit tests with coverage
        run: uv run --with-requirements requirements-test.txt pytest -m "not integration and not pact and not e2e_backend" --cov=src/asset_ltv --cov-report=xml --cov-fail-under=80

      - name: Integration tests
        run: uv run --with-requirements requirements-test.txt pytest -m integration

      - name: Pact contract tests
        run: uv run --with-requirements requirements-test.txt pytest -m pact

      - name: Backend E2E tests
        run: uv run --with-requirements requirements-test.txt pytest -m e2e_backend

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-xml
          path: code/backend/coverage.xml

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pip-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/ci

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build -f code/backend/Dockerfile.backend -t asset-ltv-backend:ci .

      - name: Build fullstack image
        run: docker build -f Dockerfile.fullstack -t asset-ltv-fullstack:ci .

  docker-publish:
    runs-on: ubuntu-latest
    needs: [lint-format, tests, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_DOCKER_IMAGES == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/asset-ltv-backend:latest
          docker build -f code/backend/Dockerfile.backend -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Build and push fullstack image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/asset-ltv-fullstack:latest
          docker build -f Dockerfile.fullstack -t "$IMAGE" .
          docker push "$IMAGE"
