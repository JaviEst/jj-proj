[tox]
envlist = format,lint,py,integration,pact,e2e-backend
skipsdist = true

[testenv]
allowlist_externals = uv
commands = uv run --with-requirements requirements-test.txt pytest -m "not integration and not pact and not e2e_backend"

[testenv:format]
commands = uv run --with-requirements requirements-test.txt ruff format --check .

[testenv:lint]
commands = uv run --with-requirements requirements-test.txt ruff check .

[testenv:integration]
commands = uv run --with-requirements requirements-test.txt pytest -m integration

[testenv:pact]
commands = uv run --with-requirements requirements-test.txt pytest -m pact

[testenv:e2e-backend]
commands = uv run --with-requirements requirements-test.txt pytest -m e2e_backend

[testenv:docker-build]
description = Build and validate all Dockerfiles locally
skip_install = true
allowlist_externals = docker
commands =
    docker build -f Dockerfile.backend -t asset-ltv-backend:test .
    docker build -f Dockerfile.frontend -t asset-ltv-frontend:test .
    docker build -f Dockerfile.fullstack -t asset-ltv-fullstack:test .
