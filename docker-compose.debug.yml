services:
  backend:
    build:
      context: .
      dockerfile: code/backend/Dockerfile.backend
    command: >
      uvicorn asset_ltv.api.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/src
    volumes:
      - ./code/backend/src:/app/src
    environment:
      CORS_ORIGINS: "http://localhost:4200,http://localhost:8000,http://localhost:3000"

  frontend:
    image: node:20-alpine
    container_name: asset-ltv-frontend-dev
    working_dir: /workspace/code/frontend/frontend
    command: >
      sh -c "npm ci &&
      node build.mjs &&
      (node --watch build.mjs &) &&
      npx --yes browser-sync start --server dist --files dist --no-open --port 80 --host 0.0.0.0"
    volumes:
      - ./:/workspace
    restart: unless-stopped
