services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: >
      uvicorn asset_ltv.api.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/src
    volumes:
      - ./src:/app/src
      - ./frontend/dist:/app/static
    environment:
      CORS_ORIGINS: "http://localhost:4200,http://localhost:8000,http://localhost:3000"
      STATIC_DIR: "/app/static"

  frontend-dev:
    image: node:20-alpine
    container_name: asset-ltv-frontend-dev
    working_dir: /workspace/frontend
    command: >
      sh -c "npm ci &&
      node build.mjs &&
      (node --watch build.mjs &) &&
      npx --yes browser-sync start --server dist --files dist --no-open --port 4200 --host 0.0.0.0"
    volumes:
      - ./frontend:/workspace/frontend
    ports:
      - "4200:4200"
    restart: unless-stopped
